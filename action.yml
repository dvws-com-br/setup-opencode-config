name: Setup OpenCode config

description: Generate OpenCode configuration

inputs:
  provider-npm:
    description: >-
      Runtime provider package. Native OpenCode packages
      (@opencode/ai/providers/*) and custom packages are used as-is; legacy
      @ai-sdk/* packages are automatically prefixed with "aisdk:" for OpenCode
      V2.
    required: true
    default: "@opencode/ai/providers/openai-compatible"

  provider-name:
    description: The provider name to use for provider
    required: true
  
  provider-base-url:
    description: Provider base URL
    required: true

  provider-api-key-name:
    description: Name of the environment variable containing the API key
    required: true

  provider-model-name:
    description: The provider model name to use for provider
    required: true
  
  provider-model-limit-context:
    description: The context limit for the provider model
    required: true

  provider-model-limit-output:
    description: The output limit for the provider model
    required: true

  provider-model-options-reasoningEffort:
    description: The reasoning effort for the provider model
    required: true

  provider-model-options-textVerbosity:
    description: The text verbosity for the provider model
    required: true

  provider-model-options-reasoningSummary:
    description: The reasoning summary for the provider model
    required: true

  permission-json:
    description: >-
      Permissions for the OpenCode configuration. Pass the OpenCode V2 ordered
      array of {action, resource, effect} entries; legacy V1 tool-grouped maps
      are converted automatically.
    required: false

  model-default:
    description: >-
      Set to "true" to also emit a top-level "model" default set to
      <provider-name>/<provider-model-name>.
    required: false
    default: "false"


outputs:
  config:
    description: OpenCode JSON configuration

runs:
  using: node24
  main: dist/index.js
