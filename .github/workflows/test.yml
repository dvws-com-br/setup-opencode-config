name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify bundle is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "dist/ is stale, run npm run build and commit"; exit 1; }

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    env:
      MY_API_KEY: ${{ secrets.MY_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Run the action
        id: opencode
        uses: ./
        with:
          provider-name: "test-provider"
          provider-base-url: "https://api.example.com/v1"
          provider-api-key-name: "MY_API_KEY"
          provider-model-name: "test-model"
          provider-model-limit-context: "32000"
          provider-model-limit-output: "4096"
          provider-model-options-reasoningEffort: "high"
          provider-model-options-textVerbosity: "concise"
          provider-model-options-reasoningSummary: "disabled"
          permission-json: '[{"action":"shell","resource":"git push *","effect":"ask"}]'
          model-default: "true"

      - name: Validate generated config
        env:
          CONFIG: ${{ steps.opencode.outputs.config }}
        run: |
          echo "$CONFIG"
          echo "$CONFIG" | grep -q '"$schema": "https://opencode.ai/config.json"'
          echo "$CONFIG" | grep -q '"providers"'
          echo "$CONFIG" | grep -q '"package": "@opencode/ai/providers/openai-compatible"'
          echo "$CONFIG" | grep -q '"baseURL": "https://api.example.com/v1"'
          echo "$CONFIG" | grep -q '"apiKey": "{env:MY_API_KEY}"'
          echo "$CONFIG" | grep -q '"env": \['
          echo "$CONFIG" | grep -q '"context": 32000'
          echo "$CONFIG" | grep -q '"permissions"'
          echo "$CONFIG" | grep -q '"model": "test-provider/test-model"'
          echo "config OK"

      - name: Run the action with a legacy @ai-sdk package
        id: opencode-legacy
        uses: ./
        with:
          provider-npm: "@ai-sdk/openai-compatible"
          provider-name: "legacy-provider"
          provider-base-url: "https://api.example.com/v1"
          provider-api-key-name: "MY_API_KEY"
          provider-model-name: "legacy-model"
          provider-model-limit-context: "32000"
          provider-model-limit-output: "4096"
          provider-model-options-reasoningEffort: "high"
          provider-model-options-textVerbosity: "concise"
          provider-model-options-reasoningSummary: "disabled"
          permission-json: '{"bash": {"git push *": "ask"}}'

      - name: Validate legacy package mapping and permission conversion
        env:
          CONFIG: ${{ steps.opencode-legacy.outputs.config }}
        run: |
          echo "$CONFIG"
          echo "$CONFIG" | grep -q '"package": "aisdk:@ai-sdk/openai-compatible"'
          echo "$CONFIG" | grep -q '"permissions"'
          echo "$CONFIG" | grep -q '"action": "shell"'
          echo "legacy config OK"
